<div class="register-container">
  <h2 mat-dialog-title>Create Account</h2>
  
  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-form">
    <mat-form-field appearance="outline">
      <mat-label>Full Name</mat-label>
      <input matInput formControlName="name" required>
      <mat-icon matSuffix>person</mat-icon>
      <mat-error *ngIf="registerForm.get('name')?.hasError('required')">
        Name is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" required>
      <mat-icon matSuffix>email</mat-icon>
      <mat-error *ngIf="registerForm.get('email')?.hasError('required')">
        Email is required
      </mat-error>
      <mat-error *ngIf="registerForm.get('email')?.hasError('email')">
        Please enter a valid email
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Password</mat-label>
      <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" required>
      <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" type="button">
        <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
      </button>
      <mat-error *ngIf="registerForm.get('password')?.hasError('required')">
        Password is required
      </mat-error>
      <mat-error *ngIf="registerForm.get('password')?.hasError('minlength')">
        Password must be at least 6 characters
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Confirm Password</mat-label>
      <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="confirmPassword" required>
      <mat-icon matSuffix>lock</mat-icon>
      <mat-error *ngIf="registerForm.get('confirmPassword')?.hasError('required')">
        Please confirm your password
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Bio (Optional)</mat-label>
      <textarea matInput formControlName="bio" rows="2" placeholder="Tell us about yourself..."></textarea>
      <mat-icon matSuffix>info</mat-icon>
    </mat-form-field>

    <div class="form-actions">
      <button mat-button type="button" mat-dialog-close>Cancel</button>
      <button mat-raised-button color="primary" type="submit" [disabled]="registerForm.invalid || isLoading">
        <mat-spinner *ngIf="isLoading" diameter="20"></mat-spinner>
        <span *ngIf="!isLoading">Register</span>
      </button>
    </div>

    <div *ngIf="errorMessage" class="error-message">
      <mat-icon>error</mat-icon>
      {{errorMessage}}
    </div>
  </form>
</div>
